<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: flex; align-items: center; justify-content: center; }
    video { max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; object-fit: contain; }
    #start {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.5); color: #fff; border: 0;
      font: 600 1.5rem system-ui, sans-serif; cursor: pointer;
    }
    #start.hidden { display: none; }
  </style>
</head>
<body>
  <!-- Put your clip next to this file as clip.mp4 -->
  <video id="v" src="clip.mp4" loop playsinline preload="auto"></video>
  <button id="start">&#9654; Play</button>

  <script>
    const v = document.getElementById('v');
    const btn = document.getElementById('start');
    btn.addEventListener('click', () => {
      btn.classList.add('hidden');
      v.play();
    });
  </script>
</body>
</html>
